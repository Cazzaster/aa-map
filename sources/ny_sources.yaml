# NY State AA meeting source registry — aa-map pilot.
#
# Researched 2026-09-05 by directly fetching each candidate feed endpoint
# (not guessed from search results alone). All AA meeting-list sites are
# independent — there is no single statewide or national feed — so each
# entry here is one Area/Intergroup/Central Office's own meeting-finder site.
#
# Feed discovery method: most of these run the TSML ("12 Step Meeting List")
# WordPress plugin. Its actual REST route is `/wp-json/tsml/meetings`
# (NOT `/wp-json/tsml/v1/meetings`, which is a commonly-assumed but wrong
# guess — it 404s everywhere). Confirm any new source the same way:
#   curl -s <site>/wp-json/tsml/meetings | wc -c   (should return a JSON array)
#
# SUMMARY (updated 2026-09-07):
#   9 entities registered
#   8 verified working feeds (NYC, Queens, Nassau, Suffolk, Albany,
#                              Syracuse, Jefferson County/North Country,
#                              Rochester)
#   Westchester needs no separate feed — already covered by the NYC
#     Intergroup feed above (westchesternyaa.org links straight to it).
#   2 feeds exist but are access-restricted by the site owner
#     (Buffalo, Rockland) — see notes; do not attempt to bypass this,
#     it's a deliberate choice by the intergroup, not a bug.
#   Still needing manual follow-up / not yet found:
#     Southern Tier: Binghamton, Elmira (small hand-maintained HTML sites,
#       no TSML/BMLT/JSON of any kind; would need a bespoke scraper for
#       unstructured prose-style listings, fragile and easily broken by a
#       future page redesign — lowest priority of what's left)
#   No BMLT-based AA source was found for NY in this pass — BMLT is far
#   more common for NA than AA; none of the sites checked use it.

sources:
  - id: ny_intergroup_nyc
    name: "New York Intergroup Association"
    region: "New York City (five boroughs) and surrounding area"
    website: "https://www.nyintergroup.org/"
    feed_type: tsml
    feed_url: "https://www.nyintergroup.org/wp-json/tsml/meetings"
    verified: true
    notes: "Confirmed 200 OK, 2878 meetings returned. By far the largest single NY source. Overlaps with queens_aa below since NYC borders Queens — deduped in build_dataset.py by matching normalized name+address+day+time."

  - id: queens_aa
    name: "Queens AA"
    region: "Queens, NYC"
    website: "https://queensaa.org/"
    feed_type: tsml
    feed_url: "https://queensaa.org/wp-json/tsml/meetings"
    verified: true
    notes: "Confirmed 200 OK, 330 meetings returned. Overlaps with ny_intergroup_nyc — deduped in build_dataset.py (see that entry's notes)."

  - id: nassau_intergroup
    name: "Nassau Intergroup of A.A."
    region: "Nassau County, Long Island"
    website: "https://nassauintergroup.org/"
    feed_type: tsml
    feed_url: "https://nassauintergroup.org/wp-json/tsml/meetings"
    verified: true
    notes: "Confirmed 200 OK, 644 meetings returned."

  - id: suffolk_intergroup
    name: "Suffolk Intergroup Association of A.A."
    region: "Suffolk County, Long Island"
    website: "https://suffolkny-aa.org/"
    feed_type: tsml
    feed_url: "https://suffolkny-aa.org/wp-json/tsml/meetings"
    verified: true
    notes: "Confirmed 200 OK, 890 meetings returned."

  - id: capital_district_central_office
    name: "Capital District Central Office (CDCO)"
    region: "Albany, Schenectady, Rensselaer, Columbia, Essex, Hamilton, Saratoga, Warren, Washington counties"
    website: "https://aaalbanyny.org/"
    feed_type: tsml
    feed_url: "https://aaalbanyny.org/wp-json/tsml/meetings"
    verified: true
    notes: "Confirmed 200 OK, 1179 meetings returned."

  - id: syracuse_intergroup
    name: "Syracuse AA Intergroup"
    region: "Syracuse / Central New York"
    website: "https://www.aasyracuse.org/"
    feed_type: tsml
    feed_url: "https://www.aasyracuse.org/wp-json/tsml/meetings"
    verified: true
    notes: "Confirmed 200 OK, 399 meetings returned."

  - id: jefferson_county_intergroup
    name: "Jefferson County Intergroup"
    region: "Watertown / North Country (Jefferson County)"
    website: "https://aajci.org/"
    feed_type: tsml
    feed_url: "https://aajci.org/wp-json/tsml/meetings"
    verified: true
    notes: "Confirmed 200 OK, 49 meetings returned. Smallest verified feed — North Country is sparsely covered; other North Country towns (Plattsburgh, Massena, Saranac Lake) not yet matched to a source."

  - id: buffalo_area_central_office
    name: "Buffalo Area AA Central Office"
    region: "Buffalo / Western New York"
    website: "https://buffaloaany.org/"
    feed_type: none_found
    feed_url: null
    verified: false
    notes: "Runs TSML (confirmed via /wp-json/ route listing) but the feed endpoint returns HTTP 403 {\"code\":\"feed_restricted\"} — the site owner has deliberately disabled public API access. Do not attempt to bypass. Would need to email buffaloaa@hotmail.com to ask about data access/inclusion, or fall back to manual/consented scraping of the public meetings page if they're open to it."

  - id: rockland_county_aa
    name: "Alcoholics Anonymous of Rockland County"
    region: "Rockland County (Hudson Valley)"
    website: "https://rocklandnyaa.org/"
    feed_type: none_found
    feed_url: null
    verified: false
    notes: "Same situation as Buffalo — TSML installed but feed explicitly restricted (403 feed_restricted). Respect this; contact the intergroup directly if we want inclusion."

  - id: rochester_area_intergroup
    name: "Rochester Area Intergroup"
    region: "Genesee, Livingston, Monroe, Ontario, Orleans, Wayne, Wyoming counties"
    website: "https://rochesteraa.org/"
    feed_type: rochester_html
    feed_url: "https://meetings.rochesteraa.org/"
    verified: true
    notes: "Runs TSML, but /wp-json/tsml/meetings is disabled (plain 404, not a WAF block) -- the REST API itself is off, not just rate-limited. The day-filtered archive page (?post_type=tsml_meeting&tsml-day=N) still embeds full meeting data (name/time/day/types + location name/address/lat/lon, no notes field at all) in a `var locations = {...}` JS blob. scripts/normalize/rochester.py fetches all 7 days (one request each, 3s apart) and extracts that blob directly -- confirmed a single isolated request succeeds; the earlier '406/404, WAF-blocked' finding was from firing several requests back-to-back, which trips a burst-rate rule. One request per day, once a night, doesn't hit it."

  - id: westchester_aa
    name: "Westchester AA (Westchester General Service Assembly)"
    region: "Westchester County (Hudson Valley)"
    website: "https://www.westchesternyaa.org/"
    feed_type: none_found
    feed_url: null
    verified: false
    notes: "westchesternyaa.org has no feed of its own -- its own 'Westchester Meetings' button links straight to nyintergroup.org/meetings/?region=westchester-county, i.e. the SAME New York Intergroup Association feed already registered above as ny_intergroup_nyc. We already pull that feed in full (unfiltered by region), so Westchester County meetings are already in the dataset -- confirmed ~130 meetings in the current build whose address matches Westchester towns (White Plains, Yonkers, New Rochelle, etc). No new source needed here; this entry is kept only as a record of why there's no separate westchester_aa feed."

  - id: binghamton_intergroup
    name: "AA Binghamton (Triple Cities Intergroup)"
    region: "Binghamton / Southern Tier (east)"
    website: "https://aabinghamton.org/"
    feed_type: none_found
    feed_url: null
    verified: false
    notes: "No TSML feed found; site appears to be a small custom/static site (meetings.php page). Would need custom HTML scraping or a direct data request — deprioritize until the verified sources are working end-to-end."

  - id: elmira_intergroup
    name: "Elmira Intergroup"
    region: "Elmira / Southern Tier (west)"
    website: "https://www.aaelmira.org/"
    feed_type: none_found
    feed_url: null
    verified: false
    notes: "Same situation as Binghamton — small site, no discoverable feed. Backlog item."
