name: Update meeting data

on:
  schedule:
    - cron: "17 9 * * *"   # ~4:17am America/New_York (offset to dodge everyone else's :00 cron)
  workflow_dispatch: {}     # allow manual "Run workflow" trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/build_dataset.py

      - name: Commit updated dataset if changed
        run: |
          git config user.name "aa-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/meetings.geojson geocode_cache.json
          git diff --cached --quiet || git commit -m "Nightly meeting data refresh"
          git push
